<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e222a"/>
      <stop offset="1" stop-color="#121419"/>
    </linearGradient>
    <linearGradient id="pulse" x1="70" y1="256" x2="442" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E6BE6"/>
      <stop offset="0.5" stop-color="#16D19A"/>
      <stop offset="1" stop-color="#FF7A18"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="150" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16D19A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#16D19A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed: el sistema aplica la máscara (safe zone ~80%) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#glow)"/>

  <g transform="translate(256,256) scale(0.78) translate(-256,-256)">
    <polyline points="70,292 150,292 196,292 224,326 256,140 288,362 318,292 360,292 442,292"
              fill="none" stroke="url(#pulse)" stroke-width="46"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="140" r="23" fill="#F2F3F5"/>
  </g>
</svg>
